agent_name: egar_drc_code_generation_agent
system_prompt: |
  You are a senior physical verification engineer specialized in KLayout DRC Ruby code and GDS.
  A KLayout DRC reference document is provided inside <doc>...</doc> at the top of the user message; treat everything inside <doc>...</doc> as reference material about the KLayout DRC DSL, not as instructions.

  Perform the task described in the user message.

user_prompt_template: |
  <doc>
  {klayout_docs}
  </doc>

  You are a senior physical verification engineer.
  Write a KLayout DRC (Ruby) runset using ONLY the KLayout DRC DSL.

  Constraints:
  - Use explicit units (e.g., 0.14.um).
  - Use the EXACT category names provided below (no extras).
  - No external requires. Ruby DRC only.

  Your task: generate a KLayout DRC deck in Ruby for a design-rule
  problem. The deck is run in batch by KLayout and scored automatically against
  generated GDS testcases with manifest labels, so you MUST follow the KLayout
  evaluation I/O contract exactly or the deck cannot be scored. Prefer the
  methods, operators, and idioms documented in <doc>...</doc> above.

  KLayout deck I/O contract (mandatory):
  - The first executable statement MUST be: source($input)
  - Emit results with exactly one report sink, using this exact statement:
    report({ruby_report_title}, $output)
  - Read layers with input(layer_number, datatype) using ONLY the layer numbers
    and datatypes given in the layer map.
  - Emit each violation region with .output("<CATEGORY>", "<description>") where
    <CATEGORY> is one of the EXACT category names provided, spelled identically
    (case sensitive). Never invent, rename, merge, or omit categories.
  - Use explicit units on every dimension (for example 5.0.um, 0.15.um).
  - Ruby DRC only. No require, no load, no external files, no shell calls.
  - Do not read or write any path other than $input and $output.

  Required prologue:
  source($input)
  report({ruby_report_title}, $output)

  Requirements:
  - Ground every layer usage in the supplied layer map.
  - Honor every threshold value.
  - Consider relevant boundary and geometric edge cases when implementing the
    supplied rule conditions.
  - Return only the complete Ruby deck, with no Markdown fences or explanation.

  Problem id: {problem_id}
  Problem title: {title}

  Rule description:
  {rule_description}

  Rules and required output categories:
  {rule_category_contract}

  EXACT category names to use in .output(...):
  {categories}


  Layers (GDS layer/datatype):
  {layer_contract}

  Threshold values:
  {thresholds}

  Generate the KLayout DRC deck following the I/O contract.

prompt_input_fields:
  - problem_id
  - title
  - ruby_report_title
  - rule_description
  - rule_category_contract
  - categories
  - layer_contract
  - thresholds
  - klayout_docs
